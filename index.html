<!DOCTYPE html>
<html lang="pl" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Piłkarski</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>

<body>
    <div class="quiz-container">
        <!-- Górny pasek z motywem -->
        <header class="quiz-header">
            <h1 class="logo">⚽ Quiz Piłkarski</h1>
            <button id="theme-toggle" class="theme-btn" title="Zmień motyw">🌙</button>
        </header>

        <!-- EKRAN STARTOWY -->
        <div id="start-screen" class="screen active">
            <div class="welcome-box">
                <div class="difficulty-selector">
                    <p>Wybierz poziom trudności:</p>
                    <div class="diff-buttons">
                        <button class="diff-btn active" data-diff="mix">Wszystkie 🎲</button>
                        <button class="diff-btn" data-diff="easy">Łatwy 🍺</button>
                        <button class="diff-btn" data-diff="medium">Średni 🍻</button>
                        <button class="diff-btn" data-diff="hard">Trudny 🍻🔥</button>
                    </div>
                </div>

                <button id="start-btn" class="primary-btn">Rozpocznij Quiz 🚀</button>
                <button id="multiplayer-menu-btn" class="secondary-btn">Tryb Multiplayer 🎮</button>
                <button id="leaderboard-btn" class="secondary-btn">Ranking 🏆</button>
            </div>
        </div>

        <!-- EKRAN QUIZU -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-info-bar">
                <span id="question-counter">Pytanie 1/10</span>
                <span id="score-counter">0</span>
            </div>

            <div class="quiz-meta">
                <span id="category-tag" class="category-tag">🗺️ Kategoria</span>
                <span id="beer-difficulty" class="beer-difficulty easy">🍺 Łatwy</span>
            </div>

            <div class="timer-container">
                <div id="timer-bar" class="timer-bar"></div>
            </div>
            <div class="timer-text"><span id="timer">15s</span></div>

            <div class="question-box">
                <h3 id="question-text">Treść pytania pojawi się tutaj...</h3>
            </div>

            <div id="answers-container" class="answers-grid">
                <!-- Odpowiedzi generowane dynamicznie -->
            </div>
        </div>

        <!-- EKRAN MENU MULTIPLAYER (Stwórz / Dołącz) -->
        <div id="mp-menu-screen" class="screen">
            <div class="welcome-box">
                <h2>🎮 Tryb Multiplayer</h2>
                <input type="text" id="mp-nickname" placeholder="Twój nick..." maxlength="15">
                <button id="create-room-btn" class="primary-btn">Stwórz stół 🏠</button>

                <div style="margin: 20px 0; border-top: 1px solid #444; padding-top: 20px;">
                    <input type="text" id="room-code-input" placeholder="Wpisz kod stołu (np. A1B2)" maxlength="6">
                    <button id="join-room-btn" class="secondary-btn">Dołącz do stołu 🚀</button>
                </div>

                <button id="mp-back-btn" class="secondary-btn" style="margin-top: 20px;">Powrót 🏠</button>
            </div>
        </div>

        <!-- EKRAN LOBBY / CZEKANIAN NA GRACZA -->
        <div id="mp-lobby-screen" class="screen">
            <div class="welcome-box">
                <h2>Czekamy na przeciwnika... ⏳</h2>
                <p>Kod Twojego stołu:</p>
                <h1 id="display-room-code" style="letter-spacing: 4px; color: #4CAF50;">----</h1>

                <div id="mp-players-list" style="margin: 20px 0; text-align: left;">
                    <!-- Lista graczy w pokoju -->
                </div>

                <button id="mp-start-game-btn" class="primary-btn" style="display: none;">Start Gry! 🚀</button>
                <button id="mp-leave-btn" class="secondary-btn">Wyjdź 🚪</button>
            </div>
        </div>

        <!-- EKRAN WYNIKÓW -->
        <div id="result-screen" class="screen">
            <div class="result-box">
                <h2>Koniec Quizu! ⚽</h2>
                <p id="final-score-text">Twój wynik końcowy: 0</p>
                <p id="bonus-info-text">Dobra robota!</p>

                <div class="save-score-section">
                    <input type="text" id="player-nickname" placeholder="Wpisz swój nick..." maxlength="15">
                    <button id="save-score-btn" class="primary-btn">Zapisz wynik 💾</button>
                </div>

                <button id="restart-btn" class="secondary-btn">Zagraj ponownie 🔄</button>
            </div>
        </div>

        <!-- EKRAN RANKINGU (LEADERBOARD) -->
        <div id="leaderboard-screen" class="screen">
            <h2>🏆 Tabela Wyników</h2>

            <!-- Zakładki wyboru rankingu -->
            <div class="lb-tabs" style="display: flex; gap: 10px; margin-bottom: 15px; justify-content: center;">
                <button id="tab-solo-btn" class="filter-btn active">Tryb Solo</button>
                <button id="tab-mp-btn" class="filter-btn">Multiplayer 🎮</button>
            </div>

            <!-- Przyciski filtrowania dla Solo -->
            <div id="solo-filters" class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Wszystkie</button>
                <button class="filter-btn" data-filter="mix">Mix</button>
                <button class="filter-btn" data-filter="easy">Łatwy</button>
                <button class="filter-btn" data-filter="medium">Średni</button>
                <button class="filter-btn" data-filter="hard">Trudny</button>
            </div>

            <div id="leaderboard-list" class="leaderboard-list">
                <p class="loading-text">Ładowanie wyników...</p>
            </div>
            <button id="back-to-start-btn" class="secondary-btn">Powrót do menu 🏠</button>
        </div>

        <!-- DOLNY PASEK NAWIGACYJNY -->
        <nav class="bottom-nav">
            <button class="nav-btn" id="nav-home" title="Strona główna">
                🏠
                <span>Start</span>
            </button>
            <button class="nav-btn" id="nav-leaderboard" title="Ranking">
                🏆
                <span>Ranking</span>
            </button>
        </nav>
    </div>

    <script src="script.js?v=2"></script>
</body>

</html>
